[package]
name = "cargo-clippy-html"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Explore structured Clippy diagnostics in portable, rustdoc-styled HTML reports"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cargo_metadata = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8.7"
tempfile = "3.27.0"
askama = "0.16.1"
webbrowser = "1.2.5"
url = "2"
ra-ap-rustc_lexer = "=0.178.0"
# The lexer requires both Unicode tables to stay on Unicode 17.
unicode-ident = "=1.0.22"
scraper = "0.24"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
similar = "3.2.1"

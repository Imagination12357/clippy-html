[package]
name = "cargo-clippy-html"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Explore structured Clippy diagnostics in portable, rustdoc-styled HTML reports"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cargo_metadata = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8.7"
tempfile = "3.27.0"
askama = "0.16.1"
webbrowser = "1.2.5"
url = "2"

[dev-dependencies]
scraper = "0.24"

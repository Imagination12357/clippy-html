<p><code>{{ path }}</code></p>
{% if reason.len() > 0 %}<p class="source-unavailable">Full source unavailable: {{ reason }}</p>{% endif %}
<div class="source-scroll"><pre class="source-code"><code>{% for row in rows %}<span class="code-line{% if row.marked %} diagnostic-line{% endif %}" id="L{{ row.number }}"><a class="line-number" href="#L{{ row.number }}">{{ row.number }}</a><span class="line-text">{{ row.text }}</span>{% for link in row.links %} <a class="diagnostic-marker" href="{{ link.href }}">{{ link.text }}</a>{% endfor %}</span>
{% endfor %}</code></pre></div>
<h2 id="findings">Findings in this file</h2>

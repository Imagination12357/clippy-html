{% if reason.len() > 0 %}<p class="source-unavailable">Full source unavailable: {{ reason }}</p>{% endif %}
<div class="example-wrap source-scroll digits-{{ digits }}"><pre class="rust source-code"><code>{% for row in rows %}<span class="code-line{% if row.marked %} diagnostic-line{% endif %}" id="L{{ row.number }}"><a class="line-number{% if row.marked %} line-highlighted{% endif %}" data-nosnippet href="#L{{ row.number }}">{{ row.number }}</a><span class="line-text">{{ row.text }}</span>{% for link in row.links %} <a class="diagnostic-marker" href="{{ link.href }}">{{ link.text }}</a>{% endfor %}</span>{% endfor %}</code></pre></div>
<h2 id="findings" class="section-header">Findings in this file<a href="#findings" class="anchor">§</a></h2>

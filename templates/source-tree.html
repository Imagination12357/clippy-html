{% if let Some(link) = file %}<a href="{{ link.href }}"{% if link.current %} class="selected" aria-current="page"{% endif %}>{{ name }} <span class="source-count" aria-label="{{ link.count }} findings">({{ link.count }})</span></a>{% else %}<details class="dir-entry"{% if open %} open{% endif %}><summary>{{ name }}</summary><div class="folders">{{ children.folders|safe }}</div><div class="files">{{ children.files|safe }}</div></details>{% endif %}

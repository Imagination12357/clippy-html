findings:
  - id: FA-001-001
    title: "A source page named settings.html initializes standalone Settings"
    location: "assets/settings.js:7,87-103; src/render/paths.rs:132-137"
    confidence: confirmed
    severity: minor
    condition: "Rust compiles a source file named settings (e.g. #[path = \"settings\"]), generating src/settings.html."
    impact: "Settings is injected into the source page and its toolbar popover remains hidden/uninitialized."
    evidence: "python .audit/full-audit/001/probe-projects.py (approved unsandboxed): real Clippy accepted #[path = \"settings\"] mod settings and generated src/settings.html#L1. Initializing the real generated HTML with settings-storage.js/settings.js in jsdom reported panelInsideMain=true, popoverExists=false, menuHidden=true. settings.js classifies solely by pathname suffix, unlike Help's DOM guard. The standalone report-root settings.html legitimately needs the other branch; source path generation is valid."
    history:
      - "probable -> confirmed: actual Cargo output plus generated-page DOM reproduction."
  - id: FA-001-002
    title: "CRLF or BOM shifts diagnostic byte coordinates"
    location: "src/source.rs:67-110; src/render/highlight.rs:220-243"
    confidence: disproven
    severity: null
    condition: "A current Clippy clone_on_copy diagnostic on line 3 of LF, CRLF or UTF-8-BOM source."
    impact: "Suspected loss of validated source links or precise annotations."
    evidence: "python .audit/full-audit/001/probe-projects.py: LF, CRLF and BOM fixtures each exited 0 and exported src/lib.rs.html#L3. Current compiler byte coordinates matched the original source under these cases; existing source-range and Git patch tests also passed. No defect established."
  - id: FA-001-003
    title: "Case aliases misclassify report-local metadata and block a new Windows output"
    location: "src/metadata/output.rs:53-66; src/output.rs:134-138"
    confidence: confirmed
    severity: important
    condition: "On a case-insensitive Windows filesystem, the report does not yet exist and --output Report is combined with --metadata report/navigation.json."
    impact: "A valid report-local metadata request fails after Clippy succeeds. Metadata staging creates an unowned report directory, so a subsequent attempt using identical casing is also rejected until the empty directory is removed manually. No existing report or source data loss was observed."
    evidence: "MetadataTarget::prepare uses case-sensitive Path::strip_prefix against the not-yet-existent output name. resolve_path cannot canonicalize that missing component, so the physical same-directory destination is classified External. stage creates its parent before report publication. python .audit/full-audit/001/probe-projects.py (approved unsandboxed) reproduced exit 1, 'Output path changed during generation', directoryLeft=true, indexExists=false; retry with matching Report casing exited 1 'Refusing to overwrite non-report directory'. A fresh Control/Control/navigation.json request exited 0 and produced index.html. Existing Windows tests cover aliases for existing generated files/locks but do not cover this pre-publication classification."

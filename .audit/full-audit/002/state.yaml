findings:
  - id: FA-002-001
    title: "Report-local metadata case aliases still take the external branch on non-Windows case-insensitive filesystems"
    location: "src/metadata/output.rs:36-82; src/output.rs:134-138"
    confidence: confirmed
    severity: important
    condition: "On a non-Windows host with a case-insensitive filesystem, a new Report output is paired with report/navigation.json."
    impact: "Metadata creates an unowned output directory before publication; HTML publication then fails and subsequent retries encounter the unowned directory."
    evidence: "Complete static trace: the alias fix is #[cfg(windows)]; other targets return None after case-sensitive Path::strip_prefix failure. For a missing report and its alias, canonical_future preserves the missing names. External stage creates report/ before publication. On case-insensitive storage this is the real output: publication either rejects changed canonical spelling or rejects the missing ownership marker. probe-platform-branch.py extracted the current non-Windows helper branch into a temporary module and imported actual output.rs unchanged on available case-insensitive storage: external=true, first error Output path changed during generation, directory left=true, index=false, matching-case retry refused non-report directory. The render/validation stubs were never reached. This is branch emulation plus static proof, NOT a native macOS/Linux execution."
    related_to: [FA-001-003]
    history:
      - "probable -> confirmed: completed source proof and actual filesystem execution of the non-Windows branch in an isolated harness."
  - id: FA-002-002
    title: "Unchanged UTF-8 BOM source loses first-line range links and suggestion diffs"
    location: "src/source.rs:85-108; src/render/suggestions.rs:107-111"
    confidence: confirmed
    severity: minor
    condition: "A real Clippy diagnostic or suggestion references the first line of a valid Rust file beginning with the UTF-8 BOM."
    impact: "The unchanged source is treated as mismatched; metadata falls back from L1 to a finding anchor, precise source marking and a valid suggestion diff are unavailable."
    evidence: "probe-boundaries.py: unchanged LF/CRLF controls exited 0, linked #L1, had precise ranges/diff; BOM input exited 0 but linked #finding-..., had zero precise ranges and displayed Diff unavailable. Raw Clippy spans: LF byte 39..48, BOM byte 42..51, both columns 40..49 and snippet without BOM. span_matches compares that snippet against first source line retaining U+FEFF and computes columns without BOM adjustment. Unlike FA-001's line-3 probe, this first line fails. This is pre-existing code, not introduced by the two fixes."
    related_to: [FA-001-002]
  - id: FA-002-003
    title: "Cargo's separate build directory is not excluded from full-source export"
    location: "src/cargo.rs:43-53; src/diagnostic/model.rs:74-78; src/source.rs:33,56-60"
    confidence: confirmed
    severity: important
    condition: "Cargo build.build-dir is configured to a separate directory under the workspace, outside target_directory; an OUT_DIR-generated Rust file emits a diagnostic."
    impact: "The report includes the full generated file and enables its suggestion patch instead of the promised generated-source snippet fallback. A published report can contain generated material beyond the diagnostic excerpt."
    evidence: "probe-boundaries.py created no-dependency projects with build.rs writing OUT_DIR/generated.rs, whose clone_on_copy warning is on line 3. Default control: Cargo target_directory/build_directory both target, source fallback anchor, no diff, no line-1 sentinel in report. Custom build-dir=generated-cache: Cargo explicitly reported target_directory=target/build_directory=generated-cache; report exported an L3 URL and a diff and full source HTML included FULL_GENERATED_SOURCE_SENTINEL from line 1 outside the diagnostic snippet. load_sources excludes only project.target_dir; separate build dir remains in an eligible root/nearest manifest. cargo_metadata 0.23.1 already exposes optional build_directory but load_project discards it. README.md:58 and the original design:111 promise generated-source fallback. No hypothetical secret or breach is claimed."
  - id: FA-002-004
    title: "Member-specific feature forwarding may cause metadata failure"
    location: "src/cli.rs:57-102; src/cargo.rs:20-32"
    confidence: disproven
    severity: null
    condition: "A non-virtual root package is selected differently from a workspace member whose feature is requested."
    impact: "Suspected failure before Clippy because metadata does not receive -p."
    evidence: "Real temp workspace with root package and member-only special feature: -p member --features special and -p member -Fspecial both exited 0. Cargo metadata --no-deps did not reject either request. No incorrect source behavior established."
  - id: FA-002-005
    title: "Windows mirror probe may classify case-sensitive distinct directories as aliases"
    location: "src/metadata/output.rs:36-82"
    confidence: disproven
    severity: null
    condition: "A new Windows output lives under an explicitly case-sensitive temporary directory; metadata uses a distinct case spelling."
    impact: "Suspected unintended internal metadata staging or merging distinct Report/report paths."
    evidence: "probe-boundaries.py successfully enabled the case-sensitive flag on its own isolated temporary parent. --output Report --metadata report/nav.json exited 0, produced Report/index.html and distinct report/nav.json. This exercises the branch skipped by default-volume tests and did not reproduce the suspected regression."
